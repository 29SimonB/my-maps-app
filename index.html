<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maps" />
  <meta name="theme-color" content="#000000" />
  <title>Maps</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font: 'DM Sans', -apple-system, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); background: #000; }

    #map { position: fixed; inset: 0; width: 100%; height: 100%; }
    .mapboxgl-ctrl-attrib, .mapboxgl-ctrl-logo { display: none !important; }

    /* ── FLOATING BUTTONS (top-right) ── */
    #fab-group {
      position: fixed;
      right: 18px;
      bottom: calc(var(--safe-bottom) + 110px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .fab {
      width: 46px; height: 46px;
      background: rgba(20,20,22,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.15s, background 0.15s;
      font-size: 20px;
      color: #fff;
    }
    .fab:active { transform: scale(0.88); background: rgba(40,40,44,0.95); }

    /* ── STYLE PICKER SHEET ── */
    #style-sheet {
      position: fixed;
      left: 16px; right: 16px;
      bottom: calc(var(--safe-bottom) + 82px);
      z-index: 103;
      background: rgba(20,20,22,0.97);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    #style-sheet.visible { display: flex; }

    .style-option {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .style-option:active { background: rgba(255,255,255,0.07); }
    .style-option.active { background: rgba(10,132,255,0.18); }

    .style-thumb {
      width: 44px; height: 44px;
      border-radius: 10px;
      flex-shrink: 0;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .style-thumb.dark   { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
    .style-thumb.streets{ background: linear-gradient(135deg, #e8e0d4 0%, #c8bfb4 50%, #a89f94 100%); }
    .style-thumb.three-d{ background: linear-gradient(135deg, #1a1a2e 0%, #2d2d4e 50%, #3d3d6e 100%); }
    .style-thumb.satellite{ background: linear-gradient(135deg, #1a3a1a 0%, #2d5a2d 50%, #4a7a4a 100%); }

    .style-info { flex: 1; }
    .style-name { font: 600 15px/1.2 var(--font); color: #fff; }
    .style-desc { font: 400 12px/1.3 var(--font); color: rgba(255,255,255,0.45); margin-top: 2px; }

    .style-check {
      width: 22px; height: 22px; border-radius: 50%;
      background: #0a84ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff; flex-shrink: 0;
      opacity: 0; transition: opacity 0.15s;
    }
    .style-option.active .style-check { opacity: 1; }

    /* ── BOTTOM SEARCH BAR ── */
    #search-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      padding: 12px 16px calc(var(--safe-bottom) + 16px);
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
    }

    .search-wrap {
      display: flex; align-items: center; gap: 10px;
      background: rgba(20,20,22,0.88);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.07) inset;
    }

    .search-icon { width: 18px; height: 18px; flex-shrink: 0; color: rgba(255,255,255,0.4); }

    #search-input {
      flex: 1; background: none; border: none; outline: none;
      font: 500 16px/1 var(--font); color: #fff; caret-color: #0a84ff;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.35); }

    .clear-btn {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,255,255,0.16); border: none;
      color: rgba(255,255,255,0.7); font-size: 12px;
      cursor: pointer; display: none; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .clear-btn.visible { display: flex; }
    .clear-btn:active { background: rgba(255,255,255,0.26); }

    /* ── SUGGESTIONS ── */
    #suggestions {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 82px);
      left: 16px; right: 16px;
      z-index: 101;
      background: rgba(20,20,22,0.97);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      display: none;
      max-height: 55vh; overflow-y: auto;
    }
    #suggestions.visible { display: block; }

    .sug-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: background 0.1s;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:active { background: rgba(255,255,255,0.06); }
    .sug-ico { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .sug-name { font: 500 15px/1.2 var(--font); color: #fff; }
    .sug-addr { font: 400 12px/1.3 var(--font); color: rgba(255,255,255,0.45); margin-top: 2px; }

    /* ── PLACE CARD ── */
    #place-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 102;
      background: rgba(20,20,22,0.97);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px 24px 0 0;
      padding: 12px 20px calc(var(--safe-bottom) + 20px);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
    }
    #place-card.visible { transform: translateY(0); }
    .card-handle { display: flex; justify-content: center; padding-bottom: 12px; }
    .card-handle-bar { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
    .card-name { font: 700 22px/1.2 var(--font); color: #fff; margin-bottom: 4px; }
    .card-addr { font: 400 14px/1.4 var(--font); color: rgba(255,255,255,0.5); margin-bottom: 18px; }
    .card-actions { display: flex; gap: 10px; }
    .card-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px; padding: 14px 8px; cursor: pointer; transition: background 0.12s;
    }
    .card-btn:active { background: rgba(255,255,255,0.13); }
    .card-btn-icon { font-size: 22px; }
    .card-btn-label { font: 600 12px/1 var(--font); color: rgba(255,255,255,0.75); }
    .go-btn { background: #0a84ff; border-color: transparent; }
    .go-btn .card-btn-label { color: #fff; }
    .go-btn:active { background: #0071e3; }

    /* ── USER DOT ── */
    .user-dot { width: 18px; height: 18px; background: #0a84ff; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 5px rgba(10,132,255,0.22); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%; transform: translateX(-50%) translateY(-8px);
      background: rgba(20,20,22,0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
      padding: 10px 18px; font: 500 14px/1 var(--font); color: #fff;
      z-index: 200; opacity: 0; transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .mapboxgl-popup-content {
      background: rgba(20,20,22,0.97) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 12px !important; padding: 10px 14px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
      color: #fff; font-family: var(--font);
    }
    .mapboxgl-popup-tip { display: none !important; }

    /* dim overlay when style sheet open */
    #overlay {
      position: fixed; inset: 0; z-index: 102;
      background: rgba(0,0,0,0.4);
      display: none;
    }
    #overlay.visible { display: block; }
  </style>
</head>
<body>

<div id="map"></div>
<div id="toast"></div>
<div id="overlay" onclick="closeStyleSheet()"></div>

<!-- Floating buttons -->
<div id="fab-group">
  <div class="fab" onclick="locateMe()">📍</div>
  <div class="fab" onclick="toggleStyleSheet()" id="style-fab">🗺</div>
</div>

<!-- Style picker -->
<div id="style-sheet">
  <div class="style-option active" id="opt-dark" onclick="setStyle('dark')">
    <div class="style-thumb dark">🌑</div>
    <div class="style-info">
      <div class="style-name">Dark</div>
      <div class="style-desc">Dark mode map</div>
    </div>
    <div class="style-check">✓</div>
  </div>
  <div class="style-option" id="opt-streets" onclick="setStyle('streets')">
    <div class="style-thumb streets">🗺</div>
    <div class="style-info">
      <div class="style-name">Standard</div>
      <div class="style-desc">Classic street map</div>
    </div>
    <div class="style-check">✓</div>
  </div>
  <div class="style-option" id="opt-3d" onclick="setStyle('3d')">
    <div class="style-thumb three-d">🏙</div>
    <div class="style-info">
      <div class="style-name">3D Buildings</div>
      <div class="style-desc">Dark with extruded buildings</div>
    </div>
    <div class="style-check">✓</div>
  </div>
  <div class="style-option" id="opt-satellite" onclick="setStyle('satellite')">
    <div class="style-thumb satellite">🛰</div>
    <div class="style-info">
      <div class="style-name">Satellite</div>
      <div class="style-desc">Aerial imagery</div>
    </div>
    <div class="style-check">✓</div>
  </div>
</div>

<!-- Suggestions -->
<div id="suggestions"></div>

<!-- Search bar -->
<div id="search-bar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search-input" type="text" placeholder="Search Maps" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="clear-btn" id="clear-btn" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- Place card -->
<div id="place-card">
  <div class="card-handle"><div class="card-handle-bar"></div></div>
  <div class="card-name" id="card-name">Place Name</div>
  <div class="card-addr" id="card-addr">Address</div>
  <div class="card-actions">
    <div class="card-btn go-btn" onclick="startNav()">
      <div class="card-btn-icon">🧭</div>
      <div class="card-btn-label">Go</div>
    </div>
    <div class="card-btn" onclick="toast('Added to Favourites ⭐')">
      <div class="card-btn-icon">♡</div>
      <div class="card-btn-label">Save</div>
    </div>
    <div class="card-btn" onclick="dismissCard()">
      <div class="card-btn-icon">✕</div>
      <div class="card-btn-label">Close</div>
    </div>
  </div>
</div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiMjlzaW1vbmIiLCJhIjoiY21udTlid201MHQ5azJycXl6cW03aHUyZCJ9.H5AM6Zs7Oi8uCvUm8oXIhA';

  const STYLES = {
    dark:      'mapbox://styles/mapbox/dark-v11',
    streets:   'mapbox://styles/mapbox/streets-v12',
    '3d':      'mapbox://styles/mapbox/dark-v11',
    satellite: 'mapbox://styles/mapbox/satellite-streets-v12',
  };

  let currentStyle = 'dark';

  const map = new mapboxgl.Map({
    container: 'map',
    style: STYLES.dark,
    center: [-74.006, 40.7128],
    zoom: 13, pitch: 50, bearing: 0, antialias: true
  });

  map.on('load', () => {
    add3DBuildings();
  });

  map.on('click', () => {
    dismissCard();
    closeSuggestions();
    closeStyleSheet();
  });

  function add3DBuildings() {
    const layers = map.getStyle().layers;
    const labelLayer = layers.find(l => l.type === 'symbol' && l.layout?.['text-field']);
    try {
      map.addLayer({
        id: '3d-buildings', source: 'composite', 'source-layer': 'building',
        filter: ['==', 'extrude', 'true'], type: 'fill-extrusion', minzoom: 14,
        paint: {
          'fill-extrusion-color': '#1a1a2e',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'min_height'],
          'fill-extrusion-opacity': 0.85
        }
      }, labelLayer?.id);
    } catch(e) {}
  }

  // ── STYLE SWITCHER ──
  function toggleStyleSheet() {
    const sheet = document.getElementById('style-sheet');
    const overlay = document.getElementById('overlay');
    const isVisible = sheet.classList.contains('visible');
    if (isVisible) {
      closeStyleSheet();
    } else {
      sheet.classList.add('visible');
      overlay.classList.add('visible');
      closeSuggestions();
      dismissCard();
    }
  }

  function closeStyleSheet() {
    document.getElementById('style-sheet').classList.remove('visible');
    document.getElementById('overlay').classList.remove('visible');
  }

  function setStyle(style) {
    if (currentStyle === style) { closeStyleSheet(); return; }
    currentStyle = style;

    // Update active indicator
    document.querySelectorAll('.style-option').forEach(el => el.classList.remove('active'));
    document.getElementById('opt-' + (style === '3d' ? '3d' : style)).classList.add('active');

    const styleUrl = STYLES[style];
    map.setStyle(styleUrl);

    map.once('styledata', () => {
      // Always try 3D buildings on dark/3d styles
      if (style === 'dark' || style === '3d') {
        add3DBuildings();
      }
      // For 3D mode, crank up the pitch
      if (style === '3d') {
        map.easeTo({ pitch: 60, zoom: 15 });
      }
    });

    const labels = { dark: '🌑 Dark', streets: '🗺 Standard', '3d': '🏙 3D Buildings', satellite: '🛰 Satellite' };
    toast(labels[style]);
    closeStyleSheet();
  }

  // ── LOCATE ──
  let userMarker = null;
  function locateMe() {
    if (!navigator.geolocation) { toast('Geolocation not supported'); return; }
    toast('Finding location…');
    navigator.geolocation.getCurrentPosition(pos => {
      const { longitude, latitude } = pos.coords;
      if (userMarker) userMarker.remove();
      const el = document.createElement('div');
      el.className = 'user-dot';
      userMarker = new mapboxgl.Marker({ element: el }).setLngLat([longitude, latitude]).addTo(map);
      map.flyTo({ center: [longitude, latitude], zoom: 15, pitch: 50, speed: 1.2 });
      toast('📍 You are here');
    }, () => toast('Could not get location'));
  }

  // ── SEARCH ──
  const PLACES = [
    { name: 'Times Square', addr: 'Manhattan, New York', lng: -73.9855, lat: 40.7580, icon: '⭐' },
    { name: 'Central Park', addr: 'New York, NY', lng: -73.9654, lat: 40.7829, icon: '🌳' },
    { name: 'Brooklyn Bridge', addr: 'Brooklyn, New York', lng: -73.9969, lat: 40.7061, icon: '🌉' },
    { name: 'Statue of Liberty', addr: 'Liberty Island, New York', lng: -74.0445, lat: 40.6892, icon: '🗽' },
    { name: 'Empire State Building', addr: '20 W 34th St, New York', lng: -73.9857, lat: 40.7484, icon: '🏢' },
    { name: 'Golden Gate Bridge', addr: 'San Francisco, CA', lng: -122.4786, lat: 37.8199, icon: '🌉' },
    { name: 'Hollywood Sign', addr: 'Los Angeles, CA', lng: -118.3213, lat: 34.1341, icon: '🎬' },
    { name: 'Grand Canyon', addr: 'Arizona, United States', lng: -112.1401, lat: 36.0544, icon: '🏜' },
    { name: 'Niagara Falls', addr: 'New York / Ontario', lng: -79.0849, lat: 43.0896, icon: '💦' },
    { name: 'Space Needle', addr: 'Seattle, Washington', lng: -122.3493, lat: 47.6205, icon: '🚀' },
    { name: 'Las Vegas Strip', addr: 'Las Vegas, Nevada', lng: -115.1728, lat: 36.1147, icon: '🎰' },
    { name: 'Eiffel Tower', addr: 'Champ de Mars, Paris', lng: 2.2945, lat: 48.8584, icon: '🗼' },
    { name: 'Big Ben', addr: 'Westminster, London', lng: -0.1246, lat: 51.5007, icon: '🕰' },
    { name: 'Sydney Opera House', addr: 'Bennelong Point, Sydney', lng: 151.2153, lat: -33.8568, icon: '🎭' },
    { name: 'Colosseum', addr: 'Piazza del Colosseo, Rome', lng: 12.4922, lat: 41.8902, icon: '🏛' },
    { name: 'Burj Khalifa', addr: 'Sheikh Mohammed Blvd, Dubai', lng: 55.2744, lat: 25.1972, icon: '🏙' },
    { name: 'Mount Fuji', addr: 'Shizuoka, Japan', lng: 138.7274, lat: 35.3606, icon: '🗻' },
    { name: 'Machu Picchu', addr: 'Cusco Region, Peru', lng: -72.5450, lat: -13.1631, icon: '🏔' },
    { name: 'Santorini', addr: 'Cyclades, Greece', lng: 25.4615, lat: 36.3932, icon: '🏝' },
    { name: 'Tokyo Tower', addr: 'Minato, Tokyo, Japan', lng: 139.7454, lat: 35.6586, icon: '🗼' },
  ];

  const searchInput = document.getElementById('search-input');
  const suggestionsEl = document.getElementById('suggestions');
  const clearBtn = document.getElementById('clear-btn');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    clearBtn.classList.toggle('visible', q.length > 0);
    closeStyleSheet();
    if (!q) { closeSuggestions(); return; }
    const matches = PLACES.filter(p =>
      p.name.toLowerCase().includes(q) || p.addr.toLowerCase().includes(q)
    ).slice(0, 6);
    if (!matches.length) { closeSuggestions(); return; }
    suggestionsEl.innerHTML = matches.map(p => `
      <div class="sug-item" onclick="selectPlace(${p.lng},${p.lat},'${p.name.replace(/'/g,"\\'")}','${p.addr.replace(/'/g,"\\'")}','${p.icon}')">
        <div class="sug-ico">${p.icon}</div>
        <div>
          <div class="sug-name">${p.name}</div>
          <div class="sug-addr">${p.addr}</div>
        </div>
      </div>`).join('');
    suggestionsEl.classList.add('visible');
  });

  function clearSearch() {
    searchInput.value = '';
    clearBtn.classList.remove('visible');
    closeSuggestions();
    searchInput.focus();
  }

  function closeSuggestions() { suggestionsEl.classList.remove('visible'); }

  // ── SELECT PLACE ──
  let activeMarker = null;

  function selectPlace(lng, lat, name, addr, icon) {
    closeSuggestions();
    closeStyleSheet();
    searchInput.value = name;
    searchInput.blur();
    clearBtn.classList.add('visible');

    if (activeMarker) activeMarker.remove();
    const el = document.createElement('div');
    el.style.cssText = `width:36px;height:36px;background:#0a84ff;border-radius:50%;border:3px solid white;
      display:flex;align-items:center;justify-content:center;font-size:16px;
      box-shadow:0 3px 12px rgba(0,0,0,0.4);`;
    el.textContent = icon;
    activeMarker = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat([lng, lat]).addTo(map);
    map.flyTo({ center: [lng, lat], zoom: 15, pitch: 55, speed: 1.1 });

    document.getElementById('card-name').textContent = name;
    document.getElementById('card-addr').textContent = addr;
    document.getElementById('place-card').classList.add('visible');
  }

  function dismissCard() { document.getElementById('place-card').classList.remove('visible'); }

  function startNav() {
    const mins = Math.floor(Math.random() * 25) + 4;
    const miles = (Math.random() * 9 + 0.5).toFixed(1);
    toast(`🧭 ${mins} min · ${miles} mi`);
    dismissCard();
  }

  // ── TOAST ──
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
