<html lang="en">
<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/framework7/8.3.3/css/framework7.bundle.min.css" />

  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; margin: 0; padding: 0; }

    /* ── MAP LAYER ── */
    #map {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .mapboxgl-ctrl-attrib, .mapboxgl-ctrl-logo { display: none !important; }

    /* ── FAB GROUP ── */
    #fab-group {
      position: fixed;
      right: 16px;
      bottom: calc(var(--safe-bottom) + 106px);
      z-index: 100;
      display: flex; flex-direction: column; gap: 10px;
    }

    #fab-group .fab {
      width: 46px; height: 46px;
      background: rgba(20,20,22,0.82) !important;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.16) !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45) !important;
      border-radius: 50% !important;
      font-size: 19px;
      transition: transform 0.14s, background 0.14s;
    }
    #fab-group .fab:active { transform: scale(0.87) !important; }
    #fab-group .fab.active-btn {
      background: rgba(10,132,255,0.28) !important;
      border-color: rgba(10,132,255,0.65) !important;
    }
    #fab-group .fab i { font-size: inherit; }

    /* ── SEARCH BAR WRAPPER ── */
    #search-bar-wrap {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      padding: 10px 12px calc(var(--safe-bottom) + 12px);
      background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    }
    #search-bar-wrap .searchbar {
      margin: 0;
      --f7-searchbar-bg-color: rgba(20,20,22,0.90);
      --f7-searchbar-border-color: rgba(255,255,255,0.12);
      --f7-searchbar-placeholder-color: rgba(255,255,255,0.38);
      --f7-searchbar-input-font-size: 16px;
      border-radius: 18px !important;
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.06) inset;
      border: 1px solid rgba(255,255,255,0.12);
      overflow: hidden;
    }
    #search-bar-wrap .searchbar input {
      color: #fff !important;
      caret-color: #0a84ff;
    }
    #search-bar-wrap .searchbar .searchbar-icon::after { color: rgba(255,255,255,0.4); }

    /* ── SUGGESTIONS SHEET ── */
    #suggestions-sheet .sheet-modal-inner { background: transparent; }
    #suggestions-sheet .sheet-modal-swipe-step { background: transparent; }

    #suggestions-list-wrap {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 80px);
      left: 12px; right: 12px;
      z-index: 101;
      background: rgba(20,20,22,0.94);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      max-height: 52vh;
      overflow-y: auto;
      display: none;
    }
    #suggestions-list-wrap.visible { display: block; }
    #suggestions-list-wrap .list { margin: 0; }
    #suggestions-list-wrap .list ul::before,
    #suggestions-list-wrap .list ul::after { display: none; }
    #suggestions-list-wrap .list .item-link {
      --f7-list-item-padding-horizontal: 14px;
      --f7-list-bg-color: transparent;
    }
    #suggestions-list-wrap .list .item-inner {
      border-bottom: 1px solid rgba(255,255,255,0.07) !important;
      padding-top: 10px; padding-bottom: 10px;
    }
    #suggestions-list-wrap .list li:last-child .item-inner { border-bottom: none !important; }
    #suggestions-list-wrap .item-title { color: #fff !important; font-weight: 500; font-size: 15px; }
    #suggestions-list-wrap .item-subtitle { color: rgba(255,255,255,0.45) !important; font-size: 12px; }
    #suggestions-list-wrap .item-media {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      min-width: 36px;
    }
    #suggestions-list-wrap .list .item-link:active,
    #suggestions-list-wrap .list .item-link.active-state {
      background: rgba(255,255,255,0.06) !important;
    }

    /* ── PLACE CARD (Sheet Modal) ── */
    .place-sheet {
      --f7-sheet-bg-color: rgba(20,20,22,0.96);
      border-radius: 24px 24px 0 0;
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      height: auto;
    }
    .place-sheet .sheet-modal-inner { padding-bottom: env(safe-area-inset-bottom, 0px); }

    .place-sheet-content { padding: 0 18px 18px; }
    .place-sheet-handle { display: flex; justify-content: center; padding: 12px 0 8px; }
    .place-sheet-handle-bar { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
    .place-sheet-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .place-sheet-addr { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 16px; }

    /* Action buttons row */
    .place-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .place-action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 14px 8px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .place-action-btn:active { background: rgba(255,255,255,0.13) !important; }
    .place-action-btn.go { background: #0a84ff; border-color: transparent; }
    .place-action-btn.go:active { background: #0071e3 !important; }
    .place-action-btn .icon { font-size: 22px; }
    .place-action-btn .lbl { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.75); }
    .place-action-btn.go .lbl { color: #fff; }

    /* ── STYLE POPOVER ── */
    .style-popover {
      --f7-popover-bg-color: rgba(20,20,22,0.96);
      --f7-popover-border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
      width: 270px;
    }
    .style-popover::before { display: none; }

    .pop-section-label {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 10px 12px 6px;
    }

    /* Style rows */
    .style-popover .list { margin: 0; }
    .style-popover .list ul::before,
    .style-popover .list ul::after { display: none; }
    .style-popover .list .item-link {
      --f7-list-bg-color: transparent;
      --f7-list-item-padding-horizontal: 10px;
    }
    .style-popover .list .item-inner { padding-top: 8px; padding-bottom: 8px; }
    .style-popover .list .item-title { color: #fff !important; font-weight: 600; font-size: 14px; }
    .style-popover .list .item-subtitle { color: rgba(255,255,255,0.4) !important; font-size: 11px; }
    .style-popover .list .item-link.active-state { background: rgba(255,255,255,0.05) !important; }
    .style-popover .list .item-link.style-active { background: rgba(10,132,255,0.15) !important; }

    .style-thumb {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1.5px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      flex-shrink: 0;
    }
    .thumb-dark      { background: linear-gradient(135deg,#1a1a2e,#0f3460); }
    .thumb-streets   { background: linear-gradient(135deg,#e8e0d4,#a89f94); }
    .thumb-satellite { background: linear-gradient(135deg,#1a3a1a,#4a7a4a); }

    .style-check { font-size: 14px; color: #0a84ff; opacity: 0; transition: opacity 0.15s; }
    .style-active .style-check { opacity: 1; }

    /* Divider */
    .pop-divider { height: 1px; background: rgba(255,255,255,0.10); margin: 4px 0; }

    /* TOD grid */
    .tod-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      padding: 4px 8px 8px;
    }
    .tod-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 11px; border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .tod-pill:active { background: rgba(255,255,255,0.10); }
    .tod-pill.active { background: rgba(10,132,255,0.15); border-color: rgba(10,132,255,0.5); }
    .tod-pill.disabled { opacity: 0.3; pointer-events: none; }
    .tod-icon { font-size: 15px; }
    .tod-label { font-size: 13px; font-weight: 500; color: #fff; }

    /* User location dot */
    .user-dot {
      width: 18px; height: 18px;
      background: #0a84ff; border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 5px rgba(10,132,255,0.22);
    }

    /* Mapbox popup */
    .mapboxgl-popup-content {
      background: rgba(20,20,22,0.97) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 12px !important; padding: 10px 14px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
      color: #fff;
    }
    .mapboxgl-popup-tip { display: none !important; }
  </style>

</head>

<script>
  // ── FRAMEWORK7 INIT ──
  const app = new Framework7({
    el: '#app',
    theme: 'ios',
    darkMode: true,
    name: 'Maps',
    colors: { primary: '#0a84ff' },
    sheet: { backdrop: false },
    toast: { position: 'top', closeTimeout: 2600 },
  });

  function showToast(msg) {
    const t = app.toast.create({ text: msg, position: 'top', closeTimeout: 2600 });
    t.open();
  }

  // ── MAPBOX ──
  mapboxgl.accessToken = 'pk.eyJ1IjoiMjlzaW1vbmIiLCJhIjoiY21udTlid201MHQ5azJycXl6cW03aHUyZCJ9.H5AM6Zs7Oi8uCvUm8oXIhA';

  const STYLE_URLS = {
    dark:      'mapbox://styles/mapbox/dark-v11',
    streets:   'mapbox://styles/mapbox/standard',
    satellite: 'mapbox://styles/mapbox/satellite-streets-v12',
  };
  const STYLE_SUPPORTS_TOD = { dark: false, streets: true, satellite: false };

  let currentStyle = 'dark', currentTOD = 'day', buildings3D = true;

  const map = new mapboxgl.Map({
    container: 'map',
    style: STYLE_URLS.dark,
    center: [6.6145, 51.8382],
    zoom: 17, pitch: 60, bearing: 0, antialias: true
  });

  map.on('load', () => { add3DBuildings(); updateTODPills(); });
  map.on('click', () => {
    app.sheet.close('#place-sheet');
    closeSuggestions();
    app.popover.close('.style-popover');
  });

  // ── 3D BUILDINGS ──
  function add3DBuildings() {
    if (!buildings3D) return;
    const layers = map.getStyle().layers;
    const labelLayer = layers.find(l => l.type === 'symbol' && l.layout?.['text-field']);
    try {
      map.addLayer({
        id: '3d-buildings', source: 'composite', 'source-layer': 'building',
        filter: ['==', 'extrude', 'true'], type: 'fill-extrusion', minzoom: 14,
        paint: {
          'fill-extrusion-color': '#1a1a2e',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'min_height'],
          'fill-extrusion-opacity': 0.85
        }
      }, labelLayer?.id);
    } catch(e) {}
  }
  function remove3DBuildings() {
    try { if (map.getLayer('3d-buildings')) map.removeLayer('3d-buildings'); } catch(e) {}
  }
  function toggle3D() {
    buildings3D = !buildings3D;
    const btn = document.getElementById('fab-3d');
    if (buildings3D) {
      btn.classList.add('active-btn'); add3DBuildings(); showToast('🏙 3D Buildings on');
    } else {
      btn.classList.remove('active-btn'); remove3DBuildings(); showToast('🏢 3D Buildings off');
    }
  }

  // ── STYLE SWITCHER ──
  function setStyle(style) {
    currentStyle = style;
    document.querySelectorAll('.style-opt').forEach(el => el.classList.remove('style-active'));
    document.getElementById('opt-' + style).classList.add('style-active');
    map.setStyle(STYLE_URLS[style]);
    map.once('styledata', () => {
      if (style !== 'satellite') add3DBuildings();
      if (STYLE_SUPPORTS_TOD[style]) applyTOD(currentTOD);
    });
    updateTODPills();
    const labels = { dark: '🌑 Dark', streets: '🗺 Standard', satellite: '🛰 Satellite' };
    showToast(labels[style]);
    app.popover.close('.style-popover');
  }

  // ── TIME OF DAY ──
  function setTOD(tod) {
    if (!STYLE_SUPPORTS_TOD[currentStyle]) return;
    currentTOD = tod;
    applyTOD(tod);
    document.querySelectorAll('.tod-pill').forEach(el => el.classList.remove('active'));
    document.getElementById('tod-' + tod).classList.add('active');
    const labels = { day: '☀️ Day', night: '🌙 Night', dawn: '🌅 Dawn', dusk: '🌆 Dusk' };
    showToast(labels[tod]);
  }
  function applyTOD(tod) {
    try { map.setConfigProperty('basemap', 'lightPreset', tod); } catch(e) {}
  }
  function updateTODPills() {
    const supported = STYLE_SUPPORTS_TOD[currentStyle];
    document.querySelectorAll('.tod-pill').forEach(el => el.classList.toggle('disabled', !supported));
    document.getElementById('tod-label').style.opacity = supported ? '1' : '0.35';
    if (supported) {
      document.querySelectorAll('.tod-pill').forEach(el => el.classList.remove('active'));
      document.getElementById('tod-' + currentTOD).classList.add('active');
    }
  }

  // ── LOCATE ──
  let userMarker = null;
  function locateMe() {
    if (!navigator.geolocation) { showToast('Geolocation not supported'); return; }
    showToast('Finding location…');
    navigator.geolocation.getCurrentPosition(pos => {
      const { longitude, latitude } = pos.coords;
      if (userMarker) userMarker.remove();
      const el = document.createElement('div'); el.className = 'user-dot';
      userMarker = new mapboxgl.Marker({ element: el }).setLngLat([longitude, latitude]).addTo(map);
      map.flyTo({ center: [longitude, latitude], zoom: 15, pitch: 50, speed: 1.2 });
      showToast('📍 You are here');
    }, () => showToast('Could not get location'));
  }

  // ── PLACES DATA ──
  const PLACES = [
    { name: 'Times Square', addr: 'Manhattan, New York', lng: -73.9855, lat: 40.7580, icon: '⭐' },
    { name: 'Central Park', addr: 'New York, NY', lng: -73.9654, lat: 40.7829, icon: '🌳' },
    { name: 'Brooklyn Bridge', addr: 'Brooklyn, New York', lng: -73.9969, lat: 40.7061, icon: '🌉' },
    { name: 'Statue of Liberty', addr: 'Liberty Island, New York', lng: -74.0445, lat: 40.6892, icon: '🗽' },
    { name: 'Empire State Building', addr: '20 W 34th St, New York', lng: -73.9857, lat: 40.7484, icon: '🏢' },
    { name: 'Golden Gate Bridge', addr: 'San Francisco, CA', lng: -122.4786, lat: 37.8199, icon: '🌉' },
    { name: 'Hollywood Sign', addr: 'Los Angeles, CA', lng: -118.3213, lat: 34.1341, icon: '🎬' },
    { name: 'Grand Canyon', addr: 'Arizona, United States', lng: -112.1401, lat: 36.0544, icon: '🏜' },
    { name: 'Niagara Falls', addr: 'New York / Ontario', lng: -79.0849, lat: 43.0896, icon: '💦' },
    { name: 'Space Needle', addr: 'Seattle, Washington', lng: -122.3493, lat: 47.6205, icon: '🚀' },
    { name: 'Las Vegas Strip', addr: 'Las Vegas, Nevada', lng: -115.1728, lat: 36.1147, icon: '🎰' },
    { name: 'Eiffel Tower', addr: 'Champ de Mars, Paris', lng: 2.2945, lat: 48.8584, icon: '🗼' },
    { name: 'Big Ben', addr: 'Westminster, London', lng: -0.1246, lat: 51.5007, icon: '🕰' },
    { name: 'Sydney Opera House', addr: 'Bennelong Point, Sydney', lng: 151.2153, lat: -33.8568, icon: '🎭' },
    { name: 'Colosseum', addr: 'Piazza del Colosseo, Rome', lng: 12.4922, lat: 41.8902, icon: '🏛' },
    { name: 'Burj Khalifa', addr: 'Sheikh Mohammed Blvd, Dubai', lng: 55.2744, lat: 25.1972, icon: '🏙' },
    { name: 'Mount Fuji', addr: 'Shizuoka, Japan', lng: 138.7274, lat: 35.3606, icon: '🗻' },
    { name: 'Machu Picchu', addr: 'Cusco Region, Peru', lng: -72.5450, lat: -13.1631, icon: '🏔' },
    { name: 'Santorini', addr: 'Cyclades, Greece', lng: 25.4615, lat: 36.3932, icon: '🏝' },
    { name: 'Tokyo Tower', addr: 'Minato, Tokyo, Japan', lng: 139.7454, lat: 35.6586, icon: '🗼' },
  ];

  // ── SEARCH ──
  const searchInput = document.getElementById('search-input');
  const suggestionsWrap = document.getElementById('suggestions-list-wrap');
  const suggestionsList = document.getElementById('suggestions-list');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    app.popover.close('.style-popover');
    if (!q) { closeSuggestions(); return; }
    const matches = PLACES.filter(p =>
      p.name.toLowerCase().includes(q) || p.addr.toLowerCase().includes(q)
    ).slice(0, 6);
    if (!matches.length) { closeSuggestions(); return; }
    suggestionsList.innerHTML = `<ul>${matches.map(p => `
      <li>
        <a class="item-link item-content" onclick="selectPlace(${p.lng},${p.lat},'${p.name.replace(/'/g,"\\'")}','${p.addr.replace(/'/g,"\\'")}','${p.icon}')">
          <div class="item-media"><div style="width:36px;height:36px;background:rgba(255,255,255,0.07);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px">${p.icon}</div></div>
          <div class="item-inner">
            <div class="item-title">${p.name}</div>
            <div class="item-subtitle">${p.addr}</div>
          </div>
        </a>
      </li>`).join('')}</ul>`;
    suggestionsWrap.classList.add('visible');
  });

  // Clear button
  document.getElementById('clear-btn').addEventListener('click', () => {
    searchInput.value = '';
    closeSuggestions();
  });

  function closeSuggestions() { suggestionsWrap.classList.remove('visible'); }

  // ── SELECT PLACE ──
  let activeMarker = null;
  function selectPlace(lng, lat, name, addr, icon) {
    closeSuggestions();
    app.popover.close('.style-popover');
    searchInput.value = name; searchInput.blur();
    if (activeMarker) activeMarker.remove();
    const el = document.createElement('div');
    el.style.cssText = `width:36px;height:36px;background:#0a84ff;border-radius:50%;border:3px solid white;
      display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 12px rgba(0,0,0,0.4);`;
    el.textContent = icon;
    activeMarker = new mapboxgl.Marker({ element: el, anchor: 'center' }).setLngLat([lng, lat]).addTo(map);
    map.flyTo({ center: [lng, lat], zoom: 15, pitch: 55, speed: 1.1 });
    document.getElementById('card-name').textContent = name;
    document.getElementById('card-addr').textContent = addr;
    app.sheet.open('#place-sheet');
  }

  function startNav() {
    const mins = Math.floor(Math.random() * 25) + 4;
    const miles = (Math.random() * 9 + 0.5).toFixed(1);
    showToast(`🧭 ${mins} min · ${miles} mi`);
    app.sheet.close('#place-sheet');
  }
</script>

</body>
