<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maps" />
  <meta name="theme-color" content="#000000" />
  <title>Maps</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font: 'DM Sans', -apple-system, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --surface: rgba(20,20,22,0.94);
      --border: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); background: #000; }
    #map { position: fixed; inset: 0; width: 100%; height: 100%; }
    .mapboxgl-ctrl-attrib, .mapboxgl-ctrl-logo { display: none !important; }

    /* ── FAB GROUP ── */
    #fab-group {
      position: fixed;
      right: 18px;
      bottom: calc(var(--safe-bottom) + 110px);
      z-index: 100;
      display: flex; flex-direction: column; gap: 10px; align-items: center;
    }

    .fab {
      width: 46px; height: 46px;
      background: rgba(20,20,22,0.82);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
      font-size: 20px; color: #fff;
      position: relative;
    }
    .fab:active { transform: scale(0.88); }
    .fab.active-btn {
      background: rgba(10,132,255,0.25);
      border-color: rgba(10,132,255,0.6);
    }

    /* ── STYLE SHEET ── */
    #style-sheet {
      position: fixed;
      right: 72px;
      bottom: calc(var(--safe-bottom) + 110px);
      z-index: 103;
      width: 270px;
      background: var(--surface);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      gap: 2px;
      transform-origin: right bottom;
      animation: popIn 0.2s cubic-bezier(0.32,0.72,0,1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }
    #style-sheet.visible { display: flex; }

    .sheet-section-label {
      font: 600 11px/1 var(--font);
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 10px 6px;
    }

    .sheet-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Style options */
    .style-option {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .style-option:active { background: rgba(255,255,255,0.06); }
    .style-option.active { background: rgba(10,132,255,0.15); }

    .style-thumb {
      width: 40px; height: 40px; border-radius: 10px;
      flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .thumb-dark       { background: linear-gradient(135deg,#1a1a2e,#0f3460); }
    .thumb-streets    { background: linear-gradient(135deg,#e8e0d4,#a89f94); }
    .thumb-satellite  { background: linear-gradient(135deg,#1a3a1a,#4a7a4a); }

    .style-info { flex: 1; }
    .style-name { font: 600 14px/1.2 var(--font); color: #fff; }
    .style-desc { font: 400 11px/1.3 var(--font); color: rgba(255,255,255,0.4); margin-top: 1px; }

    .style-check {
      width: 20px; height: 20px; border-radius: 50%;
      background: #0a84ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #fff; flex-shrink: 0;
      opacity: 0; transition: opacity 0.15s;
    }
    .style-option.active .style-check { opacity: 1; }

    /* Time-of-day pills */
    .tod-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px 2px 4px;
    }

    .tod-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .tod-pill:active { background: rgba(255,255,255,0.10); }
    .tod-pill.active {
      background: rgba(10,132,255,0.15);
      border-color: rgba(10,132,255,0.5);
    }
    .tod-pill.disabled {
      opacity: 0.3;
      pointer-events: none;
    }
    .tod-icon { font-size: 16px; }
    .tod-label { font: 500 13px/1 var(--font); color: #fff; }

    /* ── SEARCH BAR ── */
    #search-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 12px 16px calc(var(--safe-bottom) + 16px);
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
    }
    .search-wrap {
      display: flex; align-items: center; gap: 10px;
      background: rgba(20,20,22,0.88);
      backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.07) inset;
    }
    .search-icon { width: 18px; height: 18px; flex-shrink: 0; color: rgba(255,255,255,0.4); }
    #search-input {
      flex: 1; background: none; border: none; outline: none;
      font: 500 16px/1 var(--font); color: #fff; caret-color: #0a84ff;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.35); }
    .clear-btn {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,255,255,0.16); border: none;
      color: rgba(255,255,255,0.7); font-size: 12px;
      cursor: pointer; display: none; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .clear-btn.visible { display: flex; }

    /* ── SUGGESTIONS ── */
    #suggestions {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 82px); left: 16px; right: 16px;
      z-index: 101;
      background: var(--surface);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      display: none; max-height: 60vh; overflow-y: auto;
    }
    #suggestions.visible { display: block; }

    .sug-section-label {
      font: 600 11px/1 var(--font);
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 12px 16px 6px;
    }
    .sug-item {
      display: flex; align-items: center; gap: 14px;
      padding: 11px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:active { background: rgba(255,255,255,0.07); }
    .sug-ico {
      width: 38px; height: 38px; border-radius: 11px;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .sug-ico.recent  { background: rgba(255,255,255,0.06); }
    .sug-ico.place   { background: rgba(10,132,255,0.18); }
    .sug-ico.food    { background: rgba(255,149,0,0.18); }
    .sug-ico.transit { background: rgba(52,199,89,0.18); }
    .sug-text { flex: 1; min-width: 0; }
    .sug-name {
      font: 500 15px/1.2 var(--font); color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sug-name mark { background: none; color: #0a84ff; font-weight: 700; }
    .sug-addr {
      font: 400 12px/1.4 var(--font); color: rgba(255,255,255,0.42);
      margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sug-dist { font: 400 12px/1 var(--font); color: rgba(255,255,255,0.3); flex-shrink: 0; margin-left: 4px; }
    .sug-spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 20px; gap: 8px;
      font: 400 13px/1 var(--font); color: rgba(255,255,255,0.3);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sug-spinner-ring {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.4);
      animation: spin 0.7s linear infinite;
    }

    /* ── PLACE CARD ── */
    #place-card {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 102;
      background: var(--surface);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border); border-radius: 24px 24px 0 0;
      padding: 12px 20px calc(var(--safe-bottom) + 20px);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      transform: translateY(100%); transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
    }
    #place-card.visible { transform: translateY(0); }
    .card-handle { display: flex; justify-content: center; padding-bottom: 12px; }
    .card-handle-bar { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
    .card-name { font: 700 22px/1.2 var(--font); color: #fff; margin-bottom: 4px; }
    .card-addr { font: 400 14px/1.4 var(--font); color: rgba(255,255,255,0.5); margin-bottom: 18px; }
    .card-actions { display: flex; gap: 10px; }
    .card-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px; padding: 14px 8px; cursor: pointer; transition: background 0.12s;
    }
    .card-btn:active { background: rgba(255,255,255,0.13); }
    .card-btn-icon { font-size: 22px; }
    .card-btn-label { font: 600 12px/1 var(--font); color: rgba(255,255,255,0.75); }
    .go-btn { background: #0a84ff; border-color: transparent; }
    .go-btn .card-btn-label { color: #fff; }
    .go-btn:active { background: #0071e3; }

    .user-dot { width: 18px; height: 18px; background: #0a84ff; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 5px rgba(10,132,255,0.22); }

    #toast {
      position: fixed; top: calc(var(--safe-top) + 16px);
      left: 50%; transform: translateX(-50%) translateY(-8px);
      background: rgba(20,20,22,0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
      padding: 10px 18px; font: 500 14px/1 var(--font); color: #fff;
      z-index: 200; opacity: 0; transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #overlay { position: fixed; inset: 0; z-index: 102; background: rgba(0,0,0,0.3); display: none; }
    #overlay.visible { display: block; }

    .mapboxgl-popup-content {
      background: rgba(20,20,22,0.97) !important; border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 12px !important; padding: 10px 14px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important; color: #fff; font-family: var(--font);
    }
    .mapboxgl-popup-tip { display: none !important; }
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

<div id="map"></div>
<div id="toast"></div>
<div id="overlay" onclick="closeStyleSheet()"></div>

<!-- FABs -->
<div id="fab-group">

  <div class="fab" id="fab-3d"    onclick="toggle3D()" title="3D Buildings">🏙</div>
</div>

<!-- Style sheet (pops left of fab) -->
<div id="style-sheet">

  <div class="sheet-section-label">Map Style</div>

  <div class="style-option" id="opt-dark" onclick="setStyle('dark')">
    <div class="style-thumb thumb-dark">🌑</div>
    <div class="style-info"><div class="style-name">Dark</div><div class="style-desc">Dark mode</div></div>
    <div class="style-check">✓</div>
  </div>
  <div class="style-option active" id="opt-streets" onclick="setStyle('streets')">
    <div class="style-thumb thumb-streets">🗺</div>
    <div class="style-info"><div class="style-name">Standard</div><div class="style-desc">Classic streets</div></div>
    <div class="style-check">✓</div>
  </div>
  <div class="style-option" id="opt-satellite" onclick="setStyle('satellite')">
    <div class="style-thumb thumb-satellite">🛰</div>
    <div class="style-info"><div class="style-name">Satellite</div><div class="style-desc">Aerial imagery</div></div>
    <div class="style-check">✓</div>
  </div>

  <div class="sheet-divider"></div>

  <!-- Time of day section -->
  <div class="sheet-section-label" id="tod-section-label">Time of Day</div>
  <div class="tod-grid" id="tod-grid">
    <div class="tod-pill active" id="tod-day"   onclick="setTOD('day')">  <span class="tod-icon">☀️</span><span class="tod-label">Day</span></div>
    <div class="tod-pill"        id="tod-night" onclick="setTOD('night')"><span class="tod-icon">🌙</span><span class="tod-label">Night</span></div>
    <div class="tod-pill"        id="tod-dawn"  onclick="setTOD('dawn')"> <span class="tod-icon">🌅</span><span class="tod-label">Dawn</span></div>
    <div class="tod-pill"        id="tod-dusk"  onclick="setTOD('dusk')"> <span class="tod-icon">🌆</span><span class="tod-label">Dusk</span></div>
  </div>
</div>

<!-- Suggestions -->
<div id="suggestions"></div>

<!-- Search bar -->
<div id="search-bar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search-input" type="text" placeholder="Search Maps" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="clear-btn" id="clear-btn" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- Place card -->
<div id="place-card">
  <div class="card-handle"><div class="card-handle-bar"></div></div>
  <div class="card-name" id="card-name">Place Name</div>
  <div class="card-addr" id="card-addr">Address</div>
  <div class="card-actions">
    <div class="card-btn go-btn" onclick="startNav()">
      <div class="card-btn-icon">🧭</div><div class="card-btn-label">Go</div>
    </div>
    <div class="card-btn" onclick="toast('Added to Favourites ⭐')">
      <div class="card-btn-icon">♡</div><div class="card-btn-label">Save</div>
    </div>
    <div class="card-btn" onclick="dismissCard()">
      <div class="card-btn-icon">✕</div><div class="card-btn-label">Close</div>
    </div>
  </div>
</div>

async function loadBuilding(b) {
    // 1. Clip layer — punches a hole in the basemap so OSM buildings don't show through
    if (b.clipGeojson) {
      try {
        const res = await fetch(b.clipGeojson);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const clipData = await res.json();
        if (!map.getSource(`clip-src-${b.id}`)) {
          map.addSource(`clip-src-${b.id}`, { type: 'geojson', data: clipData });
        }
        if (!map.getLayer(`clip-layer-${b.id}`)) {
          map.addLayer({
            id: `clip-layer-${b.id}`,
            type: 'clip',
            source: `clip-src-${b.id}`,
            layout: {
              'clip-layer-types': ['model', 'symbol'],
              'clip-layer-scope': ['basemap'],
            },
          });
        }
      } catch (e) {
        console.warn(`[${b.id}] Could not load clip GeoJSON:`, e);
      }
    }

    if (b.id === 'modern_cityhall') {
      try { await addRathausLayer(b); return; }
      catch (e) { console.warn('Rathaus custom rendering failed; using native model', e); }
    }

    // 2. Register GLB model
    try { map.addModel(b.id, b.glbUrl); } catch (e) { /* already registered */ }

    // 3. Point source for model placement
    if (!map.getSource(`model-src-${b.id}`)) {
      map.addSource(`model-src-${b.id}`, {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [b.lng, b.lat] },
          properties: {},
        },
      });
    }

    // 4. Color from current preset
    const fallback = PRESET_FALLBACKS[currentTOD] || PRESET_FALLBACKS.day;
    const color = PRESET_FALLBACK_COLORS[currentTOD] || [220, 215, 205];
    const [r, g, bl] = color;

    // 5. Model layer
    if (!map.getLayer(`model-layer-${b.id}`)) {
      map.addLayer({
        id: `model-layer-${b.id}`,
        type: 'model',
        slot: 'middle',
        source: `model-src-${b.id}`,
        layout: { 'model-id': b.id },
        paint: {
          'model-scale': [b.scale, b.scale, b.scale],
          'model-rotation': [b.rotX, b.rotY, b.rotZ],
          'model-translation': [0, 0, b.vOffset],
          'model-opacity': 1,
          'model-cast-shadows': true,
          'model-color': `rgb(${r},${g},${bl})`,
          'model-color-mix-intensity': 0,
          'model-emissive-strength': fallback.emissive,
          'model-cutoff-fade-range': 0,
        },
      });
    }

    console.log(`✅ Loaded: ${b.id}`);
  }

  // ── RELOAD ALL BUILDINGS after style change ──
  async function loadAllBuildings() {
    for (const b of BUILDINGS) {
      await loadBuilding(b);
    }
  }

  // ── 3D BASEMAP BUILDINGS TOGGLE ──
  function toggle3D() {
    buildings3D = !buildings3D;
    const btn = document.getElementById('fab-3d');
    if (buildings3D) {
      btn.classList.add('active-btn');
      try { map.setConfigProperty('basemap', 'show3dObjects', true); } catch(e) {}
      toast('🏙 3D Buildings on');
    } else {
      btn.classList.remove('active-btn');
      try { map.setConfigProperty('basemap', 'show3dObjects', false); } catch(e) {}
      toast('🏢 3D Buildings off');
    }
  }

  // ── STYLE SWITCHER ──
  function toggleStyleSheet() {
    const sheet = document.getElementById('style-sheet');
    if (sheet.classList.contains('visible')) { closeStyleSheet(); }
    else {
      sheet.classList.add('visible');
      document.getElementById('overlay').classList.add('visible');
      closeSuggestions(); dismissCard();
    }
  }

  function closeStyleSheet() {
    document.getElementById('style-sheet').classList.remove('visible');
    document.getElementById('overlay').classList.remove('visible');
  }

  function setStyle(style) {
    currentStyle = style;
    document.querySelectorAll('.style-option').forEach(el => el.classList.remove('active'));
    document.getElementById('opt-' + style).classList.add('active');
    map.setStyle(STYLE_URLS[style]);
    map.once('style.load', async () => {
      if (STYLE_SUPPORTS_TOD[style]) applyTOD(currentTOD);
      await loadAllBuildings();
    });
    updateTODPills();
    const labels = { dark: '🌑 Dark', streets: '🗺 Standard', satellite: '🛰 Satellite' };
    toast(labels[style]);
  }

  // ── TIME OF DAY ──
  function setTOD(tod) {
    if (!STYLE_SUPPORTS_TOD[currentStyle]) return;
    currentTOD = tod;
    applyTOD(tod);
    // Update model colors to match lighting
    const fallback = PRESET_FALLBACKS[tod] || PRESET_FALLBACKS.day;
    const color = PRESET_FALLBACK_COLORS[tod] || [220, 215, 205];
    const [r, g, b] = color;
    for (const building of BUILDINGS) {
      const layerId = `model-layer-${building.id}`;
      if (!map.getLayer(layerId)) continue;
          if (map.getLayer(layerId).type === 'custom') { map.getLayer(layerId).setLightPreset(tod); continue; }
      map.setPaintProperty(layerId, 'model-color', `rgb(${r},${g},${b})`);
      map.setPaintProperty(layerId, 'model-emissive-strength', fallback.emissive);
    }
    document.querySelectorAll('.tod-pill').forEach(el => el.classList.remove('active'));
    document.getElementById('tod-' + tod).classList.add('active');
    const labels = { day: '☀️ Day', night: '🌙 Night', dawn: '🌅 Dawn', dusk: '🌆 Dusk' };
    toast(labels[tod]);
  }

  function applyTOD(tod) {
    try { map.setConfigProperty('basemap', 'lightPreset', tod); } catch(e) {}
  }

  function updateTODPills() {
    const supported = STYLE_SUPPORTS_TOD[currentStyle];
    document.querySelectorAll('.tod-pill').forEach(el => {
      el.classList.toggle('disabled', !supported);
    });
    if (supported) {
      document.querySelectorAll('.tod-pill').forEach(el => el.classList.remove('active'));
      document.getElementById('tod-' + currentTOD).classList.add('active');
    }
    const label = document.getElementById('tod-section-label');
    if (label) label.style.opacity = supported ? '1' : '0.35';
  }

  // ── LOCATE ──
  let userMarker = null;
  function locateMe() {
    if (!navigator.geolocation) { toast('Geolocation not supported'); return; }
    toast('Finding location…');
    navigator.geolocation.getCurrentPosition(pos => {
      const { longitude, latitude } = pos.coords;
      if (userMarker) userMarker.remove();
      const el = document.createElement('div');
      el.className = 'user-dot';
      userMarker = new mapboxgl.Marker({ element: el }).setLngLat([longitude, latitude]).addTo(map);
      map.flyTo({ center: [longitude, latitude], zoom: 15, pitch: 50, speed: 1.2 });
      toast('📍 You are here');
    }, () => toast('Could not get location'));
  }

  // ── SEARCH ──
  const GEOCODE_URL = 'https://api.mapbox.com/search/geocode/v6/forward';
  const SUGGEST_URL = 'https://api.mapbox.com/search/searchbox/v1/suggest';
  const RETRIEVE_URL = 'https://api.mapbox.com/search/searchbox/v1/retrieve';

  // Category → emoji icon + CSS class
  function categoryIcon(cats = []) {
    const c = (cats[0] || '').toLowerCase();
    if (c.includes('restaurant') || c.includes('food') || c.includes('cafe') || c.includes('bar') || c.includes('pizza') || c.includes('bakery')) return { icon: '🍽', cls: 'food' };
    if (c.includes('hotel') || c.includes('lodging') || c.includes('hostel')) return { icon: '🏨', cls: 'place' };
    if (c.includes('shop') || c.includes('store') || c.includes('market') || c.includes('retail')) return { icon: '🛍', cls: 'place' };
    if (c.includes('hospital') || c.includes('doctor') || c.includes('pharmacy') || c.includes('health')) return { icon: '🏥', cls: 'place' };
    if (c.includes('school') || c.includes('university') || c.includes('education')) return { icon: '🎓', cls: 'place' };
    if (c.includes('airport') || c.includes('transit') || c.includes('bus') || c.includes('train') || c.includes('station')) return { icon: '🚉', cls: 'transit' };
    if (c.includes('park') || c.includes('garden') || c.includes('nature')) return { icon: '🌿', cls: 'place' };
    if (c.includes('museum') || c.includes('gallery') || c.includes('attraction') || c.includes('landmark')) return { icon: '🏛', cls: 'place' };
    if (c.includes('bank') || c.includes('atm') || c.includes('finance')) return { icon: '🏦', cls: 'place' };
    if (c.includes('gas') || c.includes('fuel') || c.includes('petrol')) return { icon: '⛽', cls: 'place' };
    if (c.includes('sport') || c.includes('gym') || c.includes('fitness')) return { icon: '🏋', cls: 'place' };
    return { icon: '📍', cls: 'place' };
  }

  // Highlight matched query text in result name
  function highlight(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
  }

  // Recent searches stored in memory
  const recentSearches = [];
  function addRecent(item) {
    const exists = recentSearches.findIndex(r => r.mapbox_id === item.mapbox_id);
    if (exists !== -1) recentSearches.splice(exists, 1);
    recentSearches.unshift(item);
    if (recentSearches.length > 5) recentSearches.pop();
  }

  // Session token for Searchbox billing
  const SESSION_TOKEN = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);

  let debounceTimer = null;
  let lastQuery = '';

  const searchInput = document.getElementById('search-input');
  const suggestionsEl = document.getElementById('suggestions');
  const clearBtn = document.getElementById('clear-btn');

  searchInput.addEventListener('focus', () => {
    if (!searchInput.value.trim()) showRecents();
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearBtn.classList.toggle('visible', q.length > 0);
    closeStyleSheet();

    if (!q) {
      showRecents();
      return;
    }

    if (q === lastQuery) return;
    lastQuery = q;

    // Debounce 280ms
    clearTimeout(debounceTimer);
    showSpinner();
    debounceTimer = setTimeout(() => doSearch(q), 280);
  });

  function showSpinner() {
    suggestionsEl.innerHTML = '<div class="sug-spinner"><div class="sug-spinner-ring"></div>Searching…</div>';
    suggestionsEl.classList.add('visible');
  }

  function showRecents() {
    if (!recentSearches.length) { closeSuggestions(); return; }
    let html = '<div class="sug-section-label">Recents</div>';
    html += recentSearches.map(r => buildItem(r, '', true)).join('');
    suggestionsEl.innerHTML = html;
    suggestionsEl.classList.add('visible');
  }

  async function doSearch(q) {
    try {
      // Use Searchbox suggest API — returns rich POI results with categories
      const center = map.getCenter();
      const params = new URLSearchParams({
        q,
        access_token: mapboxgl.accessToken,
        session_token: SESSION_TOKEN,
        proximity: `${center.lng},${center.lat}`,
        limit: 7,
        language: 'en',
      });

      const res = await fetch(`${SUGGEST_URL}?${params}`);
      const data = await res.json();
      const suggestions = data.suggestions || [];

      if (!suggestions.length) {
        suggestionsEl.innerHTML = '<div class="sug-spinner">No results found</div>';
        return;
      }

      let html = '<div class="sug-section-label">Results</div>';
      html += suggestions.map(s => buildItem(s, q, false)).join('');
      suggestionsEl.innerHTML = html;
      suggestionsEl.classList.add('visible');

    } catch(e) {
      console.warn('Search error:', e);
      suggestionsEl.innerHTML = '<div class="sug-spinner">Search unavailable</div>';
    }
  }

  function buildItem(s, query, isRecent) {
    const name = s.name || s.place_name || '';
    const addr = s.place_formatted || s.full_address || s.address || '';
    const cats = s.feature_type ? [s.feature_type] : (s.poi_category || []);
    const { icon, cls } = isRecent ? { icon: '🕐', cls: 'recent' } : categoryIcon(cats);
    const highlightedName = highlight(name, query);
    const id = s.mapbox_id || '';

    return `<div class="sug-item" onclick="selectSuggestion('${id.replace(/'/g,"\'")}', '${name.replace(/'/g,"\'")}', '${addr.replace(/'/g,"\'")}', '${icon}')">
      <div class="sug-ico ${cls}">${icon}</div>
      <div class="sug-text">
        <div class="sug-name">${highlightedName}</div>
        ${addr ? `<div class="sug-addr">${addr}</div>` : ''}
      </div>
    </div>`;
  }

  // When user taps a suggestion, retrieve full coordinates
  async function selectSuggestion(mapboxId, name, addr, icon) {
    closeSuggestions();
    searchInput.value = name;
    searchInput.blur();
    clearBtn.classList.add('visible');

    // Find if it's already in recents (has coordinates)
    const cached = recentSearches.find(r => r.mapbox_id === mapboxId);
    if (cached && cached._coords) {
      const [lng, lat] = cached._coords;
      placeResult(lng, lat, name, addr, icon, { mapbox_id: mapboxId, name, place_formatted: addr, _coords: [lng, lat] });
      return;
    }

    try {
      const params = new URLSearchParams({
        access_token: mapboxgl.accessToken,
        session_token: SESSION_TOKEN,
      });
      const res = await fetch(`${RETRIEVE_URL}/${encodeURIComponent(mapboxId)}?${params}`);
      const data = await res.json();
      const feature = data.features?.[0];
      if (!feature) throw new Error('No feature');
      const [lng, lat] = feature.geometry.coordinates;
      const item = { mapbox_id: mapboxId, name, place_formatted: addr, _coords: [lng, lat] };
      addRecent(item);
      placeResult(lng, lat, name, addr, icon, item);
    } catch(e) {
      console.warn('Retrieve error:', e);
      toast('Could not get location');
    }
  }

  function clearSearch() {
    searchInput.value = '';
    lastQuery = '';
    clearBtn.classList.remove('visible');
    closeSuggestions();
    searchInput.focus();
  }
  function closeSuggestions() { suggestionsEl.classList.remove('visible'); }


  // ── PLACE RESULT ──
  let activeMarker = null;
  function placeResult(lng, lat, name, addr, icon) {
    closeStyleSheet();
    if (activeMarker) activeMarker.remove();
    const el = document.createElement('div');
    el.style.cssText = `width:40px;height:40px;background:#0a84ff;border-radius:50%;border:3px solid white;
      display:flex;align-items:center;justify-content:center;font-size:18px;
      box-shadow:0 3px 16px rgba(10,132,255,0.5);`;
    el.textContent = icon;
    activeMarker = new mapboxgl.Marker({ element: el, anchor: 'center' }).setLngLat([lng, lat]).addTo(map);
    map.flyTo({ center: [lng, lat], zoom: 16, pitch: 55, speed: 1.2 });
    document.getElementById('card-name').textContent = name;
    document.getElementById('card-addr').textContent = addr || '';
    document.getElementById('place-card').classList.add('visible');
  }

  function dismissCard() { document.getElementById('place-card').classList.remove('visible'); }

  function startNav() {
    const mins = Math.floor(Math.random() * 25) + 4;
    const miles = (Math.random() * 9 + 0.5).toFixed(1);
    toast(`🧭 ${mins} min · ${miles} mi`);
    dismissCard();
  }

  // ── TOAST ──
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
